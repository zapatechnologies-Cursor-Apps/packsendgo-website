services:
  mysql:
    image: mysql:8.4
    container_name: packsendgo-mysql-local
    platform: linux
    restart: unless-stopped
    env_file:
      - .env.mysql.local
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - packsendgo_mysql_local_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  packsendgo_mysql_local_data:
    name: packsendgo_mysql_local_data
